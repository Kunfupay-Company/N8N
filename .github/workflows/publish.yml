name: Stage npm release

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Validate and stage package
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install a version of npm that supports staged publishing
        run: npm install --global npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and package versions match
        run: >-
          node -e "const version = require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== version) {
          throw new Error('Tag ' + process.env.GITHUB_REF_NAME +
          ' does not match package version ' + version); }"

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Stage package on npm
        run: npm stage publish
        env:
          RELEASE_MODE: 'true'
